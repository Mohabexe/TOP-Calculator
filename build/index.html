<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./output.css">
    <script src="script.js" defer></script>
</head>
<body class="bg-[#2AB2A6]">
    <section class="flex justify-center items-center h-screen">
        <section class="w-[300px] h-[550px] bg-[#fff] rounded-lg shadow-2xl">
            <div class="h-[200px] rounded-t-lg flex flex-col justify-end"><h1 class="display text-end p-3 pr-4 text-5xl">0</h1></div>
            <div class="h-[350px] rounded-b-lg grid grid-cols-4 grid-rows-5 gap-0">
                <button class="clear col-start-1 row-start-1 col-span-2 row-span-1 text-2xl border border-[#E8E8E8] bg-[#F9F9F9] active:bg-[#C8C8C8]">C</button>
                <button class="plusminus col-start-3 row-start-1 col-span-1 row-span-1 text-2xl border border-[#E8E8E8] bg-[#F9F9F9] active:bg-[#C8C8C8]">±</button> 
                <button class="operator col-start-4 row-start-1 col-span-1 row-span-1 text-2xl border border-[#B1DDD9]  bg-[#C2EEEB] active:bg-[#AAD6D3]">+</button>
                <button class="digit col-start-1 row-start-2 col-span-1 row-span-1 text-2xl border border-[#E8E8E8] bg-[#F9F9F9] active:bg-[#C8C8C8]">1</button>
                <button class="digit col-start-2 row-start-2 col-span-1 row-span-1 text-2xl border border-[#E8E8E8] bg-[#F9F9F9] active:bg-[#C8C8C8]">2</button>
                <button class="digit col-start-3 row-start-2 col-span-1 row-span-1 text-2xl border border-[#E8E8E8] bg-[#F9F9F9] active:bg-[#C8C8C8]">3</button>
                <button class="operator col-start-4 row-start-2 col-span-1 row-span-1 text-2xl border border-[#B1DDD9] bg-[#C2EEEB] active:bg-[#AAD6D3]">-</button>
                <button class="digit col-start-1 row-start-3 col-span-1 row-span-1 text-2xl border border-[#E8E8E8] bg-[#F9F9F9] active:bg-[#C8C8C8]">4</button>
                <button class="digit col-start-2 row-start-3 col-span-1 row-span-1 text-2xl border border-[#E8E8E8] bg-[#F9F9F9] active:bg-[#C8C8C8]">5</button>
                <button class="digit col-start-3 row-start-3 col-span-1 row-span-1 text-2xl border border-[#E8E8E8] bg-[#F9F9F9] active:bg-[#C8C8C8]">6</button>
                <button class="operator col-start-4 row-start-3 col-span-1 row-span-1 text-2xl border border-[#B1DDD9] bg-[#C2EEEB] active:bg-[#AAD6D3]">x</button>
                <button class="digit col-start-1 row-start-4 col-span-1 row-span-1 text-2xl border border-[#E8E8E8] bg-[#F9F9F9] active:bg-[#C8C8C8]">7</button>
                <button class="digit col-start-2 row-start-4 col-span-1 row-span-1 text-2xl border border-[#E8E8E8] bg-[#F9F9F9] active:bg-[#C8C8C8]">8</button>
                <button class="digit col-start-3 row-start-4 col-span-1 row-span-1 text-2xl border border-[#E8E8E8] bg-[#F9F9F9] active:bg-[#C8C8C8]">9</button>
                <button class="operator col-start-4 row-start-4 col-span-1 row-span-1 text-2xl border border-[#B1DDD9] bg-[#C2EEEB] active:bg-[#AAD6D3]">/</button>
                <button class="digit col-start-1 row-start-5 col-span-1 row-span-1 text-2xl border border-[#E8E8E8] rounded-bl-lg bg-[#F9F9F9] active:bg-[#C8C8C8]">0</button>
                <button class="equals col-start-2 row-start-5 col-span-3 row-span-1 text-4xl bg-[#29B0A2] rounded-br-md text-white active:bg-[#0F7E74]">=</button>
            </div>
        </section>
    </section>
</body>
</html>
